# Publishes automatically on every push to main that changes the package:
#   1. next-version (jobcelis-team/.github) picks the version: the last release
#      plus a patch, or the version in Cargo.toml when it was raised by hand.
#      Docs, tests, CI and repo config release nothing.
#   2. writes it into Cargo.toml and commits it locally
#   3. tests it and publishes it to crates.io
#   4. pushes the version commit and tags vX.Y.Z
# To release a minor or major version, raise it in Cargo.toml.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version
        id: current
        run: |
          VERSION=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Next version
        id: v
        uses: jobcelis-team/.github/actions/next-version@main
        with:
          current: ${{ steps.current.outputs.version }}
          tag-prefix: "v"

      - name: Write the version
        if: steps.v.outputs.release == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          sed -i -E '0,/^version = ".*"/s//version = "'"$VERSION"'"/' Cargo.toml

      - name: Commit the version
        if: steps.v.outputs.release == 'true'
        uses: jobcelis-team/.github/actions/commit-version@main
        with:
          version: ${{ steps.v.outputs.version }}

      - name: Already released?
        id: check
        if: steps.v.outputs.release == 'true'
        env:
          CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: |
          MISSING=""
          [ -n "$CRATES_TOKEN" ] || MISSING="$MISSING CRATES_TOKEN"
          if [ -n "$MISSING" ]; then
            echo "::warning::Not publishing: add the repository secret(s)$MISSING, then run this workflow again (Actions > Release > Run workflow)."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -A "jobcelis-release (github.com/jobcelis-team/jobcelis-rust)" "https://crates.io/api/v1/crates/jobcelis/${{ steps.v.outputs.version }}")
          if [ "$CODE" = "200" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "${{ steps.v.outputs.version }} is already published: nothing to do"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.check.outputs.release == 'true'

      - name: Test
        if: steps.check.outputs.release == 'true'
        run: cargo test

      - name: Publish to crates.io
        if: steps.check.outputs.release == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: cargo publish

      - name: Push the version and tag the release
        if: steps.v.outputs.release == 'true' && (steps.check.outputs.release == 'true' || steps.check.outputs.published == 'true')
        uses: jobcelis-team/.github/actions/push-release@main
        with:
          tag: ${{ steps.v.outputs.tag }}
