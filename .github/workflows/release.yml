# Publishes automatically when the version below changes on main:
#   1. reads the version from Cargo.toml
#   2. if crates.io does not have it yet, tests it and publishes it
#   3. tags the commit (vX.Y.Z)
# Bump the version in Cargo.toml to release; any other change publishes nothing.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version
        id: v
        run: |
          VERSION=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Already released?
        id: check
        env:
          CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: |
          MISSING=""
          [ -n "$CRATES_TOKEN" ] || MISSING="$MISSING CRATES_TOKEN"
          if [ -n "$MISSING" ]; then
            echo "::warning::Not publishing: add the repository secret(s)$MISSING, then run this workflow again (Actions > Release > Run workflow)."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -A "jobcelis-release (github.com/jobcelis-team/jobcelis-rust)" "https://crates.io/api/v1/crates/jobcelis/${{ steps.v.outputs.version }}")
          if [ "$CODE" = "200" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "${{ steps.v.outputs.version }} is already published: nothing to do"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.check.outputs.release == 'true'

      - name: Test
        if: steps.check.outputs.release == 'true'
        run: cargo test

      - name: Publish to crates.io
        if: steps.check.outputs.release == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: cargo publish

      - name: Tag the release
        if: steps.check.outputs.release == 'true'
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "$TAG"
            git push origin "$TAG"
          fi
